[market]
base_url = "https://api.binance.com"
quote_asset = "USDT"
min_quote_volume = 30000000
min_trades = 30000
max_universe = 50
top_n = 5
request_timeout_seconds = 30
request_pause_seconds = 0.04
exclude_bases = [
  "USDT", "USDC", "FDUSD", "TUSD", "DAI", "USDP", "USDE",
  "EUR", "EURI", "AEUR", "PAXG", "USTC"
]

[analysis]
risk_reward_min = 2.0
risk_per_trade_pct = 0.01
min_history_days = 180
market_regime_filter_enabled = true
data_quality_filter_enabled = true
strict_data_quality_for_buy = true
pump_chase_24h_pct = 20.0
pump_chase_distance_pct = 8.0
pump_chase_penalty = 8.0
high_volatility_range_pct = 35.0
high_volatility_penalty = 6.0
risk_off_core_buy_enabled = true
validation_pool_multiplier = 2
validation_pool_max = 10

[paper]
account_name = "demo"
account_equity = 10000
risk_per_trade_pct = 0.01
import_actions = ["BUY_CANDIDATE"]

[backtest]
maker_fee_bps = 4
taker_fee_bps = 10
entry_slippage_bps = 5
stop_slippage_bps = 10
intrabar_policy = "stop_first"
primary_interval = "4h"
execution_interval = "4h"
initial_equity = 10000
max_open_plans = 10
max_active_positions = 5
total_active_risk_pct = 0.05
risk_per_trade_pct = 0.01
max_position_notional_pct = 1.0
allow_leverage = false
watch_expiry_bars = 18
warmup_1h_bars = 200
warmup_4h_bars = 100
warmup_1d_bars = 80

[data_validation]
enabled = true
coingecko_base_url = "https://api.coingecko.com/api/v3"
coinmarketcap_base_url = "https://pro-api.coinmarketcap.com"
price_warning_pct = 1.0
price_error_pct = 2.0
pct_24h_warning_points = 3.0
request_timeout_seconds = 30
request_pause_seconds = 0.08

[data_validation.coin_id_overrides]
BTC = "bitcoin"
ETH = "ethereum"
BNB = "binancecoin"
SOL = "solana"
XRP = "ripple"
DOGE = "dogecoin"
ADA = "cardano"
AVAX = "avalanche-2"
TRX = "tron"
TON = "the-open-network"
WLD = "worldcoin-wld"
ZEC = "zcash"
NEAR = "near"
ONDO = "ondo-finance"
PORTAL = "portal-2"

[output]
database_path = "data/crypto_trading.db"
reports_dir = "reports"
obsidian_dir = "D:/MyNotebook-Obsidian/CryptoTradingSystem"
