[history_250]
enabled = true
description = "Test min_history_days 250 versus baseline 180."
dimension = "history"

[history_250.overrides.analysis]
min_history_days = 250

[history_365]
enabled = true
description = "Test min_history_days 365 versus baseline 180."
dimension = "history"

[history_365.overrides.analysis]
min_history_days = 365

[pump_chase_strict]
enabled = true
description = "Test stricter pump-chasing score penalties."
dimension = "pump_chase"

[pump_chase_strict.overrides.analysis]
pump_chase_24h_pct = 12.0
pump_chase_distance_pct = 6.0
pump_chase_penalty = 12.0

[liquidity_50m]
enabled = true
description = "Test higher liquidity thresholds."
dimension = "liquidity"

[liquidity_50m.overrides.market]
min_quote_volume = 50000000
min_trades = 50000

[risk_off_no_core_buy]
enabled = true
description = "Test disabling new BTC/ETH BUY_CANDIDATE entries during RISK_OFF regimes."
dimension = "regime"

[risk_off_no_core_buy.overrides.analysis]
risk_off_core_buy_enabled = false

[top_n_3]
enabled = true
description = "Test lower per-scan candidate capacity to reduce clustered correlated entries."
dimension = "capacity"

[top_n_3.overrides.market]
top_n = 3

[risk_off_no_core_top_n_3]
enabled = true
description = "Combine RISK_OFF core-buy pause with lower candidate capacity."
dimension = "combined_regime_capacity"

[risk_off_no_core_top_n_3.overrides.analysis]
risk_off_core_buy_enabled = false

[risk_off_no_core_top_n_3.overrides.market]
top_n = 3

[entry_reclaim_close]
enabled = true
description = "Require a 4h close back above entry_high before entering after the entry zone is touched."
dimension = "entry_timing"

[entry_reclaim_close.overrides.analysis]
entry_reclaim_close_enabled = true

[risk_off_no_core_entry_reclaim]
enabled = true
description = "Combine RISK_OFF core-buy pause with 4h entry reclaim confirmation."
dimension = "combined_regime_entry"

[risk_off_no_core_entry_reclaim.overrides.analysis]
risk_off_core_buy_enabled = false
entry_reclaim_close_enabled = true

[tp1_breakeven_stop]
enabled = true
description = "Move stop loss to breakeven after TP1 is hit."
dimension = "exit_timing"

[tp1_breakeven_stop.overrides.analysis]
tp1_move_stop_to_breakeven_enabled = true

[tp1_ema20_trailing_stop]
enabled = true
description = "After TP1 hit, trail stop with 4h EMA20 instead of immediate breakeven."
dimension = "exit_timing"

[tp1_ema20_trailing_stop.overrides.analysis]
tp1_ema_trailing_stop_enabled = true

[risk_off_no_core_entry_reclaim_ema_stop]
enabled = true
description = "Combine RISK_OFF core-buy pause, 4h entry reclaim confirmation, and TP1 EMA20 trailing stop."
dimension = "combined_regime_entry_exit"

[risk_off_no_core_entry_reclaim_ema_stop.overrides.analysis]
risk_off_core_buy_enabled = false
entry_reclaim_close_enabled = true
tp1_ema_trailing_stop_enabled = true

[daily_trend_required]
enabled = true
description = "Require daily trend confirmation (price > EMA20_1d >= EMA50_1d) before allowing BUY_CANDIDATE."
dimension = "daily_trend"

[daily_trend_required.overrides.analysis]
daily_trend_required = true

[risk_off_no_core_entry_reclaim_ema_stop_daily_trend]
enabled = true
description = "Combine RISK_OFF core-buy pause, 4h entry reclaim confirmation, TP1 EMA20 trailing stop, and daily trend confirmation (only applies in RISK_ON)."
dimension = "combined_regime_entry_exit_daily_trend"

[risk_off_no_core_entry_reclaim_ema_stop_daily_trend.overrides.analysis]
risk_off_core_buy_enabled = false
entry_reclaim_close_enabled = true
tp1_ema_trailing_stop_enabled = true
daily_trend_required = true

[volatility_without_trend_penalty]
enabled = false
description = "Requires scanner logic support before this experiment can run."
dimension = "volatility_trend"
requires_logic = true
